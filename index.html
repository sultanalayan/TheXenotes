<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xenos Notes</title>
  <meta name="description" content="Xenos study notes on Islamic books and topics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Mrs+Saint+Delafield&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════ -->
<div class="header-topbar">
  <div class="header-topbar-left">
    <a href="#/" class="header-topbar-left" style="display:flex;align-items:center;gap:8px;">
      <div class="header-dot"></div>
      <span>XENOS</span>
    </a>
    <span class="sep">•</span>
    <span style="font-family:var(--font-arabic);font-size:13px;color:var(--muted);">الغرباء</span>
  </div>
  <a class="discord-link" href="https://discord.gg/Z4Rn9WwR4R" target="_blank" rel="noopener">
    <span>💬</span><span>Join the Discord</span>
  </a>
</div>

<div class="header-main" id="header-main">
  <div class="header-arabic-bg" id="header-arabic-bg"></div>
  <div class="header-inner">
    <a href="#/" class="logo-mark" id="header-logo" aria-label="Xenos Notes home">
      <svg class="logo-pattern" viewBox="0 0 90 90" aria-hidden="true">
        <g fill="none" stroke="#A03B54" stroke-width="0.7" opacity="0.35">
          <path d="M45 4 L54 22 L74 18 L66 37 L86 45 L66 53 L74 72 L54 68 L45 86 L36 68 L16 72 L24 53 L4 45 L24 37 L16 18 L36 22 Z"/>
        </g>
      </svg>
      <svg class="logo-branch" viewBox="0 0 60 60" aria-hidden="true">
        <path d="M6 54 C 18 46, 26 34, 34 16" fill="none" stroke="#62804F" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="20" cy="40" rx="6" ry="3" fill="#869F6E" transform="rotate(-35 20 40)"/>
        <ellipse cx="27" cy="28" rx="5.5" ry="2.8" fill="#62804F" transform="rotate(-45 27 28)"/>
        <ellipse cx="33" cy="19" rx="5" ry="2.5" fill="#869F6E" transform="rotate(-55 33 19)"/>
        <circle cx="35" cy="14" r="3.2" fill="#B48A4C"/>
        <circle cx="30" cy="10" r="2.2" fill="#C2637C"/>
        <circle cx="39" cy="9" r="2.2" fill="#C2637C"/>
      </svg>
      <span class="logo-text">
        <span class="logo-script">Xenos</span>
        <span class="logo-arabic">الغُرَباء</span>
      </span>
    </a>
    <div class="header-content">
      <div class="header-eyebrow">
        <span class="header-eyebrow-text">Xenos Notes</span>
        <span class="header-badge">Study Notes</span>
      </div>
      <h1 class="header-title" id="header-title"></h1>
      <p class="header-sub" id="header-sub"></p>
      <div class="header-tags" id="header-tags"></div>
      <div class="gold-bar"></div>
    </div>
  </div>
</div>

<!-- ═══════════════ BODY ═══════════════ -->
<div class="layout">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="closeSidebar()">✕ Close</button>
    <div id="sidebar-wrap"></div>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <div class="mobile-controls">
      <button class="hamburger" onclick="openSidebar()">☰ &nbsp; Sections</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- FOOTER -->
<div class="footer">
  <span class="footer-left">Xenos Notes · study notes on Islamic books &amp; topics</span>
  <a class="footer-right" href="https://discord.gg/Z4Rn9WwR4R" target="_blank" rel="noopener">Xenos <span style="font-family:var(--font-arabic);">الغرباء</span></a>
</div>

<!-- ═══════════════ ENGINE ═══════════════ -->
<script src="app.js"></script>

<!-- ═══════════════ BOOKS ═══════════════
     To add a new book: drop books/<slug>.js (copy the shape of an existing one)
     and add one <script> line below. Nothing else needs to change. -->
<script src="books/sharh-al-sunnah.js"></script>
<script src="books/nukhbat-al-fikar.js"></script>
<script src="books/manhaj-al-sunnah.js"></script>

</body>
</html>
